name: Flutter Build APK

# Ditrigger oleh bot Telegram (Orca Studio) lewat workflow_dispatch.
# Simpan file ini di repo GitHub kamu pada path:
#   .github/workflows/flutter_build.yml
#
# Input yang dikirim bot: zip_url, tag, build_type.
# JANGAN menambah input WAJIB baru, karena bot hanya mengirim 3 input itu.
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (asset GitHub Release)"
        required: true
        type: string
      tag:
        description: "Tag unik build (juga nama release & artifact)"
        required: true
        type: string
      build_type:
        description: "debug, release, atau analyze (cek compile saja, tanpa APK)"
        required: false
        default: "release"
        type: string
      flutter_version:
        description: "Versi Flutter SDK (opsional)"
        required: false
        default: "3.41.9"
        type: string

# Cukup baca isi repo (dipakai untuk download asset release, termasuk repo private)
permissions:
  contents: read

concurrency:
  group: flutter-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      CI: "true"
    steps:
      - name: Validasi input
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          TAG: ${{ inputs.tag }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          [ -n "$ZIP_URL" ] || { echo "::error::Input zip_url kosong."; exit 1; }
          [ -n "$TAG" ] || { echo "::error::Input tag kosong."; exit 1; }
          case "${BUILD_TYPE:-release}" in
            debug|release|analyze) ;;
            *) echo "::error::build_type harus debug, release, atau analyze (diterima: $BUILD_TYPE)"; exit 1 ;;
          esac

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Versi di-pin supaya tidak kena breaking change Flutter terbaru
      # (mis. class IconData jadi final di 3.44+ yang merusak font_awesome_flutter lama).
      # Ganti lewat input flutter_version kalau project kamu butuh versi lain.
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: "stable"
          cache: true

      - name: Download ZIP project
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
          TAG: ${{ inputs.tag }}
        run: |
          rm -f project.zip
          # Cara utama: lewat GitHub CLI + token (jalan juga untuk repo PRIVATE)
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --output project.zip --clobber; then
            echo "Download via gh release OK"
          else
            echo "gh release gagal, coba lewat URL langsung..."
            curl -L --fail --retry 3 --retry-delay 3 -o project.zip "$ZIP_URL"
          fi
          unzip -tq project.zip >/dev/null || { echo "::error::File ZIP rusak atau tidak valid."; exit 1; }

      - name: Extract ZIP & cari project Flutter
        run: |
          rm -rf project
          mkdir -p project
          unzip -q -o project.zip -d project
          rm -rf project/__MACOSX

          # Cari pubspec.yaml terdangkal (project boleh dibungkus 1-3 folder)
          PUBSPEC=$(find project -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.*' -not -path '*/build/*' -not -path '*/node_modules/*' \
            -printf '%d %p\n' | sort -n | head -1 | cut -d' ' -f2-)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP. Pastikan ZIP berisi project Flutter yang valid."
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          echo "Project Flutter ditemukan di: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Buat folder android kalau tidak ada
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d android ]; then
            NAME=$(grep -m1 '^name:' pubspec.yaml | sed 's/^name:[[:space:]]*//' | tr -d "\"' \r")
            echo "Folder android tidak ada, generate otomatis (project-name: $NAME)..."
            flutter create . --platforms=android --project-name "$NAME" --no-pub
          fi

      - name: Terima lisensi Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # Mode "analyze": cek compile saja, tanpa APK.
      - name: Flutter analyze
        if: inputs.build_type == 'analyze'
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        if: inputs.build_type != 'analyze'
        working-directory: ${{ env.APP_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            # --no-tree-shake-icons mencegah error umum "non-constant IconData"
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Kumpulkan file APK
        if: inputs.build_type != 'analyze'
        run: |
          mkdir -p dist
          find "$APP_DIR/build/app/outputs" -name '*.apk' -not -name '*unaligned*' -exec cp -v {} dist/ \;
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::Build selesai tapi file .apk tidak ditemukan."
            exit 1
          fi
          ls -lh dist

      - name: Upload APK sebagai artifact
        if: inputs.build_type != 'analyze'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3
